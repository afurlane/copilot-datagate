name: Release

on:
  workflow_run:
    workflows: ["Build & Quality Checks"]
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  build-release:
    name: Build ${{ matrix.name }}
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: linux-aarch64
            runner: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - name: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - name: windows-aarch64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
            archive: zip
          - name: macos-x86_64
            runner: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - name: macos-aarch64
            runner: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross compiler
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package Unix binary
        if: ${{ matrix.archive == 'tar.gz' }}
        shell: bash
        run: |
          package="copilot-datagate-${{ needs.release.outputs.tag_name }}-${{ matrix.name }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/copilot-datagate" "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"

      - name: Package Windows binary
        if: ${{ matrix.archive == 'zip' }}
        shell: pwsh
        run: |
          $package = "copilot-datagate-${{ needs.release.outputs.tag_name }}-${{ matrix.name }}"
          New-Item -ItemType Directory -Path "dist/$package" -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/copilot-datagate.exe" "dist/$package/"
          Compress-Archive -Path "dist/$package" -DestinationPath "dist/$package.zip"

      - name: Generate checksum
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum *.* > "SHA256SUMS-${{ matrix.name }}"
          else
            shasum -a 256 *.* > "SHA256SUMS-${{ matrix.name }}"
          fi

      - name: Upload artifacts to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ needs.release.outputs.tag_name }}" dist/* --clobber

  sonar-analysis:
    name: SonarQube Quality Scan
    runs-on: ubuntu-latest
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
          fetch-depth: 0

      - name: Download SonarScanner CLI
        run: |
          curl -sSLo sonar.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.0.1.6346-linux-x64.zip
          unzip sonar.zip
          mv sonar-scanner-* sonar-scanner
          echo "$PWD/sonar-scanner/bin" >> $GITHUB_PATH

      - name: Setup Rust for coverage
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install coverage tools
        run: |
          cargo install cargo-llvm-cov --locked
          cargo install lcov2generic --locked

      - name: Generate LCOV and convert for Sonar
        run: |
          mkdir -p coverage
          cargo llvm-cov --all-features --lcov --output-path coverage/lcov.info
          lcov2generic coverage/lcov.info coverage/sonar-coverage.xml

      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_URL: ${{ secrets.SONAR_URL }}
        run: |
          sonar-scanner \
            -Dsonar.projectKey=copilot-datagate \
            -Dsonar.projectName="DataGate" \
            -Dsonar.sources=src \
            -Dsonar.coverage.exclusions=src/main.rs,src/backend/postgres.rs,src/schema.rs \
            -Dsonar.coverageReportPaths=coverage/sonar-coverage.xml \
            -Dsonar.branch.name=${{ github.event.workflow_run.head_branch }} \
            -Dsonar.host.url=$SONAR_URL \
            -Dsonar.token=$SONAR_TOKEN

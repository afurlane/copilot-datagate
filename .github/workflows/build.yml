name: Build & Quality Checks

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
  pull_request:
    branches: [ master ]
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache Cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: cargo-build-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-build-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --all-targets --verbose

      - name: Test
        run: cargo test --all-features --verbose

  security-audit:
    name: cargo-audit & cargo-deny
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache Cargo security tools
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin
          key: cargo-security-tools-${{ runner.os }}
          restore-keys: |
            cargo-security-tools-${{ runner.os }}-

      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: command -v cargo-deny >/dev/null || cargo install cargo-deny --locked

      - name: Run cargo audit
        run: cargo audit

      - name: Run cargo deny
        run: cargo deny check

  sonar-analysis:
    name: SonarQube Quality Scan
    runs-on: ubuntu-latest
    needs: build
    if: ${{ needs.build.result == 'success' }}
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Cache SonarScanner
        uses: actions/cache@v6
        with:
          path: |
            sonar-scanner
            ~/.sonar/cache
          key: sonar-scanner-8.0.1-${{ runner.os }}

      - name: Download SonarScanner CLI
        run: |
          if [[ ! -x sonar-scanner/bin/sonar-scanner ]]; then
            curl -sSLo sonar.zip https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-8.0.1.6346-linux-x64.zip
            unzip -q sonar.zip
            mv sonar-scanner-* sonar-scanner
          fi
          echo "$PWD/sonar-scanner/bin" >> $GITHUB_PATH

      - name: Setup Rust for coverage
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache Cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache Cargo coverage build and tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            target
          key: cargo-coverage-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-coverage-${{ runner.os }}-

      - name: Install coverage tools
        run: |
          command -v cargo-llvm-cov >/dev/null || cargo install cargo-llvm-cov --locked
          command -v lcov2generic >/dev/null || cargo install lcov2generic --locked

      - name: Generate LCOV and convert for Sonar
        run: |
          mkdir -p coverage
          cargo llvm-cov --all-features --lcov --output-path coverage/lcov.info
          lcov2generic coverage/lcov.info coverage/sonar-coverage.xml

      - name: Run SonarQube Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_URL: ${{ secrets.SONAR_URL }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            sonar-scanner \
              -Dsonar.projectKey=copilot-datagate \
              -Dsonar.projectName="DataGate" \
              -Dsonar.sources=src \
              -Dsonar.coverage.exclusions=src/main.rs,src/bin/datagate-benchmark.rs,src/backend/postgres.rs,src/backend/mysql.rs,src/schema.rs \
              -Dsonar.cpd.exclusions=src/backend/mysql.rs \
              -Dsonar.issue.ignore.multicriteria=s6697_config,s6697_mysql \
              -Dsonar.issue.ignore.multicriteria.s6697_config.ruleKey=secrets:S6697 \
              -Dsonar.issue.ignore.multicriteria.s6697_config.resourceKey=src/config.rs \
              -Dsonar.issue.ignore.multicriteria.s6697_mysql.ruleKey=secrets:S6697 \
              -Dsonar.issue.ignore.multicriteria.s6697_mysql.resourceKey=src/backend/mysql.rs \
              -Dsonar.coverageReportPaths=coverage/sonar-coverage.xml \
              -Dsonar.qualitygate.wait=false \
              -Dsonar.pullrequest.key=${{ github.event.pull_request.number }} \
              -Dsonar.pullrequest.branch=${{ github.head_ref }} \
              -Dsonar.pullrequest.base=${{ github.base_ref }} \
              -Dsonar.host.url=$SONAR_URL \
              -Dsonar.token=$SONAR_TOKEN
          else
            sonar-scanner \
              -Dsonar.projectKey=copilot-datagate \
              -Dsonar.projectName="DataGate" \
              -Dsonar.sources=src \
              -Dsonar.coverage.exclusions=src/main.rs,src/bin/datagate-benchmark.rs,src/backend/postgres.rs,src/backend/mysql.rs,src/schema.rs \
              -Dsonar.cpd.exclusions=src/backend/mysql.rs \
              -Dsonar.issue.ignore.multicriteria=s6697_config,s6697_mysql \
              -Dsonar.issue.ignore.multicriteria.s6697_config.ruleKey=secrets:S6697 \
              -Dsonar.issue.ignore.multicriteria.s6697_config.resourceKey=src/config.rs \
              -Dsonar.issue.ignore.multicriteria.s6697_mysql.ruleKey=secrets:S6697 \
              -Dsonar.issue.ignore.multicriteria.s6697_mysql.resourceKey=src/backend/mysql.rs \
              -Dsonar.coverageReportPaths=coverage/sonar-coverage.xml \
              -Dsonar.qualitygate.wait=false \
              -Dsonar.branch.name=${{ github.head_ref || github.ref_name }} \
              -Dsonar.host.url=$SONAR_URL \
              -Dsonar.token=$SONAR_TOKEN
          fi

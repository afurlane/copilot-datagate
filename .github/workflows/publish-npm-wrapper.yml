name: Publish npm wrapper

"on":
  workflow_dispatch:
    inputs:
      version:
        description: npm package version to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @copilot-datagate/cli
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Verify package version
        working-directory: packaging/npm
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e "const p=require('./package.json'); if (p.version !== process.env.VERSION) throw new Error(`${p.version} !== ${process.env.VERSION}`)"

      - name: Test package
        working-directory: packaging/npm
        run: npm test

      - name: Dry-run package
        working-directory: packaging/npm
        run: npm publish --access public --provenance --dry-run

      - name: Publish package
        working-directory: packaging/npm
        run: npm publish --access public --provenance

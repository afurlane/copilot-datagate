# Example DataGate policy configuration.
# Copy to `datagate.toml` (or set DATAGATE_CONFIG to a custom path) and adjust.
#
# Security note: only tables/columns listed here are ever reachable by MCP
# tools. Anything not explicitly allow-listed is denied by the policy engine.

profile = "dev"

# Named profiles are selected by the `profile` value above. The legacy flat
# [policy] section remains supported when no [profiles] section is configured.

# PostgreSQL credentials are read only from the environment, never from this file.
# Backend selection is also environment-driven via DATAGATE_BACKEND
# (auto|postgres|mysql|mariadb|sqlite). Default is auto.
# Compact form: DB_URL, optionally with DB_OPTIONS as key=value&key=value.
# Component form: DB_HOST, DB_PORT, DB_USER, DB_PASSWORD, DB_NAME.
# Pool settings: DB_MAX_CONNECTIONS and DB_ACQUIRE_TIMEOUT_SECS.
# DB_URL takes precedence when both forms are present.

[profiles.dev.policy]
default_row_limit = 100
max_row_limit = 1000
max_query_complexity = 100
max_output_bytes = 131072

[profiles.dev.policy.tables.users]
columns = ["id", "email", "created_at"]

[profiles.dev.policy.tables.users.filter_operators]
id = ["equals", "not_equals", "greater_than", "greater_than_or_equal", "less_than", "less_than_or_equal", "between"]
email = ["equals", "not_equals", "like", "ilike", "full_text"]
created_at = ["equals", "greater_than", "greater_than_or_equal", "less_than", "less_than_or_equal", "between"]

[profiles.dev.policy.tables.orders]
columns = ["id", "user_id", "total", "status"]

[profiles.dev.policy.tables.orders.filter_operators]
id = ["equals", "between"]
user_id = ["equals", "between"]
total = ["equals", "greater_than", "greater_than_or_equal", "less_than", "less_than_or_equal", "between"]
status = ["equals", "not_equals", "like", "ilike", "full_text"]

# Multi-schema: use a quoted key for schema-qualified table names.
[profiles.dev.policy.tables."audit.users"]
columns = ["id", "email", "action", "created_at"]

[profiles.dev.policy.tables."audit.users".filter_operators]
id = ["equals", "between"]
email = ["equals", "ilike"]
action = ["equals", "not_equals", "full_text"]
created_at = ["equals", "greater_than", "greater_than_or_equal", "less_than", "less_than_or_equal", "between"]

[graph]
all-features = false

[advisories]
ignore = [
    # Transitive via sqlx-mysql -> rsa; no patched release currently available.
    # Tracked in CI until upstream publishes a fix.
    "RUSTSEC-2023-0071",
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "ISC",
    "Zlib",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
